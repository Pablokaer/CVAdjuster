# ==============================================
# Production overrides ? activated via SPRING_PROFILES_ACTIVE=prod
# ==============================================

# Thymeleaf: enable template caching in production
spring.thymeleaf.cache=true

# JPA: suppress SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging: reduce noise, keep warnings and errors visible
logging.level.com.resumetailor=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN


# Sessão / cookies
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Actuator: expor somente health e info em produção
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

