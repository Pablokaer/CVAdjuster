<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CV FIT AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" th:href="@{/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>

<nav class="topbar auth-topbar">
  <div class="topbar-inner">
    <a href="/" class="topbar-brand">CV FIT AI</a>
  </div>
</nav>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-wrapper">
  <div class="card" style="max-width:420px; width:100%;">

    <h2 style="font-family:'Epilogue',sans-serif; font-weight:700; font-size:22px; margin-bottom:6px;">Create account</h2>
    <p style="color:var(--text-muted); font-size:14px; margin-bottom:24px; text-transform:none; letter-spacing:0; font-family:'Figtree',sans-serif;">Start tailoring your resume with AI</p>

    <div th:if="${error}" class="alert alert-error">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" method="post" th:object="${user}">

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field" style="margin-top:16px;">
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" placeholder="••••••••" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn-submit" style="margin-top:24px;">
        Create account
      </button>

    </form>

    <p style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:20px; font-family:'Figtree',sans-serif; text-transform:none; letter-spacing:0;">
      Already have an account? <a href="/login" style="color:var(--accent); text-decoration:none;">Sign in</a>
    </p>

    <p style="text-align:center; font-size:13px; margin-top:10px; font-family:'Figtree',sans-serif; text-transform:none; letter-spacing:0;">
      <a href="/forgot-password" style="color:var(--text-muted); text-decoration:none; transition:color 0.2s;"
         onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">
        Forgot your password?
      </a>
    </p>

  </div>
</div>

</body>
</html>
