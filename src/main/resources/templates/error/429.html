<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Too Many Requests — CV FIT AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" th:href="@{/favicon.png}">
  <th:block th:replace="~{fragments/app-shell :: head}"></th:block>
  <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <a href="/" class="topbar-brand" aria-label="CV Fit AI — home"><img class="brand-icon" th:src="@{/images/logo-icon.png}" alt="" width="42" height="46"><img class="brand-word" th:src="@{/images/font.png}" alt="CV Fit AI" width="99" height="19"></a>
  </div>
</nav>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-wrapper">
  <div class="card" style="max-width:420px; width:100%;">

    <div style="width:56px; height:56px; border-radius:50%;
                background:rgba(251,191,36,0.12); border:1px solid rgba(251,191,36,0.3);
                display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
           fill="none" stroke="#fbbf24" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>

    <h2 style="font-family:'Sora',sans-serif; font-weight:700; font-size:22px; margin-bottom:8px;">
      Slow down a little
    </h2>
    <p style="color:var(--text-muted); font-size:14px; font-family:'Inter',sans-serif;
              text-transform:none; letter-spacing:0; line-height:1.6; margin-bottom:28px;">
      Too many attempts in a short time. Please wait a few minutes and try again.
      If a resume is still being generated in another tab, let it finish first.
    </p>

    <a href="/" class="btn-submit" style="display:flex; text-decoration:none;">
      Back to home
    </a>

  </div>
</div>

</body>
</html>
