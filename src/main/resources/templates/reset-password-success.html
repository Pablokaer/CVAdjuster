<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Updated — Fit My CV</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" th:href="@{/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <a href="/" class="topbar-brand">Fit My CV</a>
    <div class="topbar-actions">
      <a href="/login" class="btn-nav-primary">Sign in</a>
    </div>
  </div>
</nav>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-wrapper">
  <div class="card" style="max-width:420px; width:100%;">

    <div style="width:56px; height:56px; border-radius:50%;
                background:rgba(74,222,128,0.12); border:1px solid rgba(74,222,128,0.3);
                display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
           fill="none" stroke="var(--success)" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h2 style="font-family:'Syne',sans-serif; font-weight:700; font-size:22px; margin-bottom:8px;">
      Password updated
    </h2>
    <p style="color:var(--text-muted); font-size:14px; font-family:'DM Sans',sans-serif;
              text-transform:none; letter-spacing:0; line-height:1.6; margin-bottom:28px;">
      Your password has been changed successfully. You can now sign in with your new password.
    </p>

    <a href="/login" class="btn-submit" style="display:flex; text-decoration:none;">
      Go to sign in
    </a>

  </div>
</div>

</body>
</html>
