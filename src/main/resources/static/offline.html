<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061B32">
  <title>Offline — CV FIT AI</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="card" style="max-width:420px; width:100%; text-align:center;">

    <img src="/icons/icon-192.png" alt="" width="72" height="72"
         style="border-radius:18px; margin:0 auto 20px; display:block;">

    <h2 style="font-family:'Sora',sans-serif; font-weight:700; font-size:22px; margin-bottom:8px;">
      You're offline
    </h2>
    <p style="color:var(--text-muted); font-size:14px; font-family:'Inter',sans-serif;
              text-transform:none; letter-spacing:0; line-height:1.6; margin-bottom:28px;">
      CV Fit AI needs an internet connection to tailor your resume.
      Check your connection and try again.
    </p>

    <button type="button" class="btn-submit" onclick="location.reload()">Try again</button>

  </div>
</div>

</body>
</html>
