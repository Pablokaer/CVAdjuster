# ==============================================
# Resume Tailor - Application Configuration
# ==============================================

# ==============================================
# SERVER
# ==============================================
server.port=8080

# ==============================================
# DATABASE (PostgreSQL - Docker)
# ==============================================
spring.datasource.url=jdbc:postgresql://localhost:5434/resumetailor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
# validate — Hibernate apenas verifica se o schema bate com as entidades; quem migra é o Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# FLYWAY
spring.flyway.enabled=true
# baseline-on-migrate: ao encontrar um banco já existente sem histórico Flyway,
# marca o estado atual como versão 0 e aplica apenas as migrações acima disso.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hikari (pool de conex�o)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==============================================
# SECURITY (LOCAL AUTH)
# ==============================================
spring.security.user.name=disabled
spring.security.user.password=disabled

# ==============================================
# OAUTH2 (OPTIONAL LOGIN)
# ==============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ==============================================
# OPENAI API
# ==============================================
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-4o
openai.api.max-tokens=8192

# ==============================================
# FILE UPLOAD
# ==============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================
# THYMELEAF
# ==============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ==============================================
# LOGGING
# ==============================================
logging.level.com.resumetailor=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ==============================================
# TEMP FILES
# ==============================================
app.temp-dir=${java.io.tmpdir}/resume-tailor

# ==============================================
# STRIPE
# ==============================================
# Keys from https://dashboard.stripe.com/test/apikeys
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# URLs Stripe redirects to after checkout (must be absolute)
stripe.success-url=http://localhost:8080/credits
stripe.cancel-url=http://localhost:8080/credits