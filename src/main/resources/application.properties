# ==============================================
# Resume Tailor - Application Configuration
# ==============================================

# ==============================================
# SERVER
# ==============================================
server.port=8080

# ==============================================
# DATABASE (PostgreSQL - Docker)
# ==============================================
spring.datasource.url=jdbc:postgresql://localhost:5434/resumetailor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
# validate — Hibernate apenas verifica se o schema bate com as entidades; quem migra é o Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# FLYWAY
spring.flyway.enabled=true
# baseline-on-migrate: ao encontrar um banco já existente sem histórico Flyway,
# marca o estado atual como versão 0 e aplica apenas as migrações acima disso.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hikari (pool de conex�o)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==============================================
# SECURITY (LOCAL AUTH)
# ==============================================
spring.security.user.name=disabled
spring.security.user.password=disabled

# ==============================================
# OAUTH2 (OPTIONAL LOGIN)
# ==============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ==============================================
# OPENAI API
# ==============================================
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-4o
openai.api.max-tokens=8192

# ==============================================
# FILE UPLOAD
# ==============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================
# THYMELEAF
# ==============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ==============================================
# LOGGING
# ==============================================
logging.level.com.resumetailor=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ==============================================
# TEMP FILES
# ==============================================
app.temp-dir=${java.io.tmpdir}/resume-tailor
app.base-url=http://localhost:8080

# ==============================================
# STRIPE
# ==============================================
# Keys from https://dashboard.stripe.com/test/apikeys
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# URLs Stripe redirects to after checkout (must be absolute)
stripe.success-url=http://localhost:8080/credits
stripe.cancel-url=http://localhost:8080/credits

# ==============================================
# EMAIL (Gmail SMTP)
# ==============================================
# MAIL_USERNAME     → your Gmail address (e.g. you@gmail.com)
# MAIL_APP_PASSWORD → 16-char app password from https://myaccount.google.com/apppasswords
#                     Requires 2-Step Verification to be enabled on the Google account.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
# Fail at startup if SMTP credentials are wrong — prevents silent email delivery failures
spring.mail.test-connection=true
# Required by Gmail: authenticate before sending
spring.mail.properties.mail.smtp.auth=true
# Upgrade plain connection to TLS (port 587 uses STARTTLS, not SSL)
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Tell JavaMail to trust Gmail's certificate during the STARTTLS handshake
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Fail fast instead of hanging — values in milliseconds
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# The address that appears in the From: header
app.mail.from=${MAIL_USERNAME}