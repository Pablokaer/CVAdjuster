version: '3.8'
services:
  app:
	image: myrepo/resumetailor:latest
	restart: always
	env_file:
	  - .env
	environment:
	  - SPRING_PROFILES_ACTIVE=prod
	ports:
	  - "8080:8080"
	depends_on:
	  - db
  db:
	image: postgres:15
	restart: always
	env_file:
	  - .env
	volumes:
	  - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
	driver: local


