name: Android release

# Builds the Android app (a Trusted Web Activity generated by Bubblewrap from
# android/twa-manifest.json) and uploads it to Google Play.
#
# Site changes reach the app without a new release, so this does not run on every
# deploy. Release a new app build when the Android shell changes (name, icon, colors,
# start URL, target SDK):
#   - push a tag:        git tag android-v1.0.1 && git push origin android-v1.0.1
#   - or run it by hand: Actions > Android release > Run workflow
# Pull requests that touch the Android config only build the app, signed with a
# throwaway key, to catch build errors early. They never upload anything.

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users, e.g. 1.0.1'
        required: true
      version_code:
        description: 'Version code (leave empty to use the run number + 1)'
        required: false
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status (use draft while the app has never been published)'
        type: choice
        options: [completed, draft]
        default: completed
  pull_request:
    paths:
      - 'android/twa-manifest.json'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

env:
  BUBBLEWRAP_VERSION: '1.27.0'
  BUILD_TOOLS_VERSION: '36.1.0'
  PACKAGE_NAME: com.cvfitai.app

jobs:
  build:
    name: Build app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Android SDK and Bubblewrap config
        run: |
          set -euo pipefail
          # Bubblewrap looks for sdkmanager under tools/bin; the runner has it in cmdline-tools/latest.
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;$BUILD_TOOLS_VERSION" "platforms;android-36" > /dev/null
          mkdir -p ~/.bubblewrap
          jq -n --arg jdk "$JAVA_HOME" --arg sdk "$ANDROID_HOME" \
            '{jdkPath: $jdk, androidSdkPath: $sdk}' > ~/.bubblewrap/config.json

      - name: Set version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)              name="${GITHUB_REF_NAME#android-v}" ;;
            workflow_dispatch) name="$INPUT_VERSION_NAME" ;;
            *)                 name="0.0.0" ;;
          esac
          # Play rejects a version code it has already seen, so each run gets a new one.
          code="${INPUT_VERSION_CODE:-$((GITHUB_RUN_NUMBER + 1))}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version name must look like 1.2.3 (got '$name')"; exit 1
          fi
          if ! [[ "$code" =~ ^[0-9]+$ ]] || [ "$code" -lt 2 ]; then
            echo "::error::Version code must be a number above 1, the first manual upload (got '$code')"; exit 1
          fi
          jq --arg name "$name" --argjson code "$code" \
            '.appVersion = $name | .appVersionCode = $code | .signingKey.path = "./upload.keystore"' \
            android/twa-manifest.json > twa-manifest.tmp
          mv twa-manifest.tmp android/twa-manifest.json
          echo "Building version $name ($code)"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "artifact=android-$name-$code" >> "$GITHUB_OUTPUT"

      - name: Use the upload key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD secrets"; exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/upload.keystore
          {
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Use a throwaway key (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore android/upload.keystore -alias upload \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI build" \
            -storepass "$password" -keypass "$password" -noprompt
          {
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$password"
            echo "BUBBLEWRAP_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build with Bubblewrap
        working-directory: android
        run: |
          set -euo pipefail
          # update regenerates the Android project from twa-manifest.json, so build has nothing to ask.
          npx --yes "@bubblewrap/cli@$BUBBLEWRAP_VERSION" update --skipVersionUpgrade
          npx --yes "@bubblewrap/cli@$BUBBLEWRAP_VERSION" build

      - name: Check the signature
        working-directory: android
        run: |
          set -euo pipefail
          jarsigner -verify app-release-bundle.aab > /dev/null
          keytool -printcert -jarfile app-release-bundle.aab | grep -E 'Owner|SHA256:'

      - name: Remove the key
        if: always()
        run: rm -f android/upload.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}

    outputs:
      artifact: ${{ steps.version.outputs.artifact }}

  upload:
    name: Upload to Google Play
    needs: build
    # Never on pull requests: their build is signed with a throwaway key and they get no secrets.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: google-play-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app-release-bundle.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
