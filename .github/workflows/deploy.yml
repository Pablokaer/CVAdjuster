name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload jar
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: resume-tailor-jar
          path: target/resume-tailor-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    # Only pushes to main (never pull requests, so fork PRs can't reach the secrets).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resume-tailor-jar

      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          # The key on the server is restricted to deploy.sh; the commit sha is the only argument it accepts.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" "$GITHUB_SHA" < resume-tailor-0.0.1-SNAPSHOT.jar

      - name: Smoke test
        run: |
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://cvfitai.com/login || true)
            if [ "$code" = "200" ]; then echo "cvfitai.com/login -> 200"; exit 0; fi
            sleep 5
          done
          echo "cvfitai.com/login did not return 200 (last: $code)"
          exit 1
